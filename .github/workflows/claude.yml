name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only the owner, members and collaborators can start a run, because the
    # run gets the OAuth token and reads text that anyone can write.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comment the video link
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The present skill, for the instructions below. This action version
      # predates plugins, so the session reads the skill from this folder.
      - name: Get the present skill
        run: git clone --depth 1 https://github.com/bisque-cloud/presenter "$RUNNER_TEMP/presenter"

      - name: Run Claude Code
        id: claude
        # Pinned to the commit of the beta tag (v0.0.63), so a moved tag cannot change the code that gets the token.
        uses: anthropics/claude-code-action@28f83620103c48a57093dcc2837eec89e036bb9f # beta (v0.0.63)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read
          
          # Optional: Specify model (defaults to Claude Sonnet 4, uncomment for Claude Opus 4.1)
          # model: "claude-opus-4-1-20250805"
          
          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"
          
          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"
          
          # Optional: Allow Claude to run specific commands
          # allowed_tools: "Bash(npm install),Bash(npm run build),Bash(npm run test:*),Bash(npm run lint:*)"
          
          # Optional: Add custom instructions for Claude to customize its behavior for your project
          # custom_instructions: |
          #   Follow our coding standards
          #   Ensure all new code has tests
          #   Use TypeScript for new files
          
          # Optional: Custom environment variables for Claude
          # claude_env: |
          #   NODE_ENV: test

          allowed_tools: "Write,Edit,WebFetch,Bash(node:*),Bash(mkdir:*)"
          custom_instructions: |
            When you are asked to review or explain a pull request, after you have answered, decide whether it is worth a short video for someone who did not write it: yes for a design decision, a new command or option, a migration, or a change where the reasoning matters more than the diff; no for a dependency bump, formatting, a typo or a small fix. If it is, read ${{ runner.temp }}/presenter/skills/present/SKILL.md and follow it to make a presentation of the pull request from what you have already read: what it changes, why, and what a reviewer should look at. Write index.html, context.md, assets/ and title.txt (one line, the title) to ${{ runner.temp }}/explainer. Run the skill's plan, pronunciation-report and narrate with --voice kokoro:af_heart and fix what they report. Do not run login or publish: the next step of this job publishes the folder and comments the link. If it is not worth a video, write nothing there.

      # Publishes the presentation the session above wrote, as this
      # repository, to its bisque.today channel, and comments the link on the
      # pull request. A separate step because claude-code-action keeps the
      # token that publishes away from Claude's session. No folder, no publish.
      - name: Check for a presentation
        id: explainer
        run: |
          if [ -f "$RUNNER_TEMP/explainer/index.html" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the presentation
        if: steps.explainer.outputs.ready == 'true'
        continue-on-error: true
        uses: bisque-cloud/presenter@v1
        with:
          source: pull-request
          presentation: ${{ runner.temp }}/explainer
